<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/pwa"><title>Ultron</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#03070d;color:#f6d77a;font:15px system-ui;display:grid;place-items:center}.wrap{text-align:center;width:100vw;height:100vh;display:grid;place-items:center;position:relative}.content{width:min(720px,92vw);margin-top:-4vh}h1{font-size:clamp(24px,4vw,42px);letter-spacing:9px;margin:0 0 8px;text-shadow:0 0 20px #ffe04b}.status{color:#d6ad3a;min-height:24px}.orb{display:block;width:min(65vw,360px);height:min(65vw,360px);margin:20px auto;filter:drop-shadow(0 0 28px #ffd21f)}.orb.listening{filter:drop-shadow(0 0 58px #ff9b24)}video{display:none}.reply{min-height:30px;max-width:620px;margin:auto;padding:14px;color:#f6e3a0;white-space:pre-wrap;text-shadow:0 0 10px #8a751c}.hint{position:fixed;bottom:20px;left:0;right:0;color:#8a751c;font-size:12px}@keyframes pulse{50%{transform:scale(1.025)}}
</style></head><body><main class="wrap"><section class="content"><h1>ULTRON</h1><div class="status" id="status">INITIALIZING SCREEN…</div><canvas class="orb" id="orb"></canvas><video id="camera" playsinline></video><div class="reply" id="reply"></div></section><div class="hint">Voice and gesture interface · allow microphone and camera access once</div></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#orb'),status=document.querySelector('#status'),reply=document.querySelector('#reply');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.z=4;const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const group=new THREE.Group();
const gold=new THREE.Color(0xff8a16),hot=new THREE.Color(0xffe15a);const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.18,3),new THREE.MeshBasicMaterial({color:0xffa01b,wireframe:true,transparent:true,opacity:.58}));const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(.72,2),new THREE.MeshBasicMaterial({color:0xffd13b,wireframe:true,transparent:true,opacity:.42}));const core=new THREE.Mesh(new THREE.SphereGeometry(.28,24,24),new THREE.MeshBasicMaterial({color:0xffffdb}));
const particleCount=1800,positions=new Float32Array(particleCount*3),colors=new Float32Array(particleCount*3);for(let i=0;i<particleCount;i++){let u=Math.random()*2-1,a=Math.random()*Math.PI*2,r=1.05+Math.random()*.38, s=Math.sqrt(1-u*u),j=i*3;positions[j]=r*s*Math.cos(a);positions[j+1]=r*u;positions[j+2]=r*s*Math.sin(a);let c=Math.random()>.18?gold:hot;colors[j]=c.r;colors[j+1]=c.g;colors[j+2]=c.b}const particleGeo=new THREE.BufferGeometry();particleGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));particleGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));const particles=new THREE.Points(particleGeo,new THREE.PointsMaterial({size:.018,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));
const energy=new THREE.Group();for(let i=0;i<34;i++){let a=Math.random()*Math.PI*2,tilt=(Math.random()-.5)*1.2,len=2.0+Math.random()*1.5;let geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Math.cos(a)*.25,Math.sin(a)*.25,tilt),new THREE.Vector3(Math.cos(a)*len,Math.sin(a)*len,tilt+(Math.random()-.5)*.35)]);energy.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:i%4?0xff7512:0xffff93,transparent:true,opacity:.25+Math.random()*.6,blending:THREE.AdditiveBlending})))}group.add(shell,inner,core,particles,energy);scene.add(group);
function resize(){let r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();let speaking=false;let busy=false;let gesture={x:0,y:0,zoom:1};function animate(){let now=Date.now();group.rotation.y+=.004;group.rotation.x=Math.sin(now/1800)*.08;group.position.x+=(gesture.x-group.position.x)*.12;group.position.y+=(gesture.y-group.position.y)*.12;let voiceZoom=speaking?1+Math.sin(now/170)*.16:1;let targetZoom=voiceZoom*gesture.zoom;group.scale.x+=(targetZoom-group.scale.x)*.12;group.scale.y+=(targetZoom-group.scale.y)*.12;group.scale.z+=(targetZoom-group.scale.z)*.12;renderer.render(scene,camera);requestAnimationFrame(animate)}animate();
function restartListening(){if(!recognition||busy||speaking)return;try{recognition.start()}catch(e){}}async function send(message){if(busy)return;busy=true;if(recognition)try{recognition.stop()}catch(e){}status.textContent='Thinking…';try{let r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});let d=await r.json();reply.textContent=d.reply||d.error||'No response';if('speechSynthesis'in window){speaking=true;speechSynthesis.cancel();let voice=new SpeechSynthesisUtterance(reply.textContent);voice.onend=()=>{speaking=false;setTimeout(restartListening,250)};speechSynthesis.speak(voice)}}catch(e){reply.textContent='Connection error: '+e.message}finally{busy=false;status.textContent='Listening…';if(!speaking)setTimeout(restartListening,250)}}
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition,starting=false;if(Recognition){recognition=new Recognition();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;recognition.onstart=()=>{starting=false;canvas.classList.add('listening');status.textContent='Listening…'};recognition.onend=()=>{canvas.classList.remove('listening');starting=false;if(!busy&&!speaking)setTimeout(restartListening,350)};recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){status.textContent='Microphone permission is required; allow it and reload this page.'}else if(e.error!=='aborted')status.textContent='Voice connection interrupted; restarting…'};recognition.onresult=e=>{let result=e.results[e.results.length-1];if(result.isFinal){let command=result[0][0].transcript.trim();if(command)send(command)}};window.addEventListener('load',()=>{starting=true;try{recognition.start()}catch(e){status.textContent='Allow microphone access, then reload.'}})}else status.textContent='This browser does not support voice commands. Use Chrome or Edge.';
async function startHands(){try{if(!window.Hands||!window.Camera)throw Error('MediaPipe did not load');let stream=await navigator.mediaDevices.getUserMedia({video:true});let video=document.querySelector('#camera');video.srcObject=stream;await video.play();let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.55});hands.onResults(r=>{let h=r.multiHandLandmarks?.[0];if(!h){gesture.x*=.92;gesture.y*=.92;gesture.zoom+=(1-gesture.zoom)*.08;return}let tip=h[8],thumb=h[4];gesture.x=(tip.x-.5)*2.0;gesture.y=(.5-tip.y)*1.35;let pinch=Math.hypot(tip.x-thumb.x,tip.y-thumb.y);gesture.zoom=THREE.MathUtils.clamp(.78+pinch*2.1,.78,1.35);status.textContent=speaking?'Speaking · gesture tracking active':'Hand gesture tracking active · voice listening'});let cam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:640,height:480});cam.start()}catch(e){status.textContent='Voice active · camera unavailable: '+e.message}}window.addEventListener('load',startHands);
</script></body></html>
