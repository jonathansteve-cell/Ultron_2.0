<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/pwa"><title>Ultron Orb</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#102d51,#05080d 52%);color:#dceaff;font:15px system-ui;display:grid;place-items:center}.wrap{text-align:center;width:min(760px,94vw)}h1{letter-spacing:7px;margin:4px}.sub{color:#89a6c8}.stage{height:330px;position:relative}.orb{position:absolute;inset:0;width:270px;height:270px;margin:auto;filter:drop-shadow(0 0 28px #328dff)}.orb.listening{filter:drop-shadow(0 0 38px #2ee6a6)}.orb.tracking{filter:drop-shadow(0 0 42px #ff4dcc)}video{display:none}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button,a{border:1px solid #31577e;background:#10233d;color:#dceaff;border-radius:22px;padding:10px 16px;cursor:pointer;text-decoration:none}button.primary{background:#58a6ff;color:#07111f;font-weight:700}.reply{margin:18px auto 10px;padding:15px;text-align:left;white-space:pre-wrap;background:#0d1727cc;border:1px solid #203852;border-radius:15px;min-height:54px}.plan{color:#91b3d8;font-size:13px;min-height:20px}ul{text-align:left;margin:6px auto;max-width:440px;padding-left:25px}@media(max-width:500px){.stage{height:280px}.orb{width:230px;height:230px}}
</style></head><body><main class="wrap"><h1>ULTRON</h1><div class="sub" id="status">Autonomous design assistant · ready</div><div class="stage"><canvas class="orb" id="orb"></canvas><video id="camera" playsinline></video></div><div class="controls"><button class="primary" id="mic">● Speak</button><button id="continuous">◉ Continuous voice</button><button id="vision">◌ Screen</button><button id="hands">✦ Hands</button><a href="/">Chat</a></div><div class="reply" id="reply">Awaiting command.</div><div class="plan" id="plan"></div></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#orb'),status=document.querySelector('#status'),reply=document.querySelector('#reply'),plan=document.querySelector('#plan');
const scene=new THREE.Scene(),camera3=new THREE.PerspectiveCamera(42,1,.1,100);camera3.position.z=4;const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const group=new THREE.Group(),shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.18,2),new THREE.MeshBasicMaterial({color:0x55b5ff,wireframe:true,transparent:true,opacity:.72}));const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(.72,2),new THREE.MeshBasicMaterial({color:0x9ee8ff,wireframe:true,transparent:true,opacity:.28}));const core=new THREE.Mesh(new THREE.SphereGeometry(.35,24,24),new THREE.MeshBasicMaterial({color:0xdaf8ff}));group.add(shell,inner,core);scene.add(group);function resize(){let r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera3.aspect=r.width/r.height;camera3.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){group.rotation.y+=.004;group.rotation.x=Math.sin(Date.now()/1800)*.08;renderer.render(scene,camera3);requestAnimationFrame(animate)}animate();
async function send(message){status.textContent='Planning…';plan.textContent='';try{let p=await fetch('/agent/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})}).then(r=>r.json());plan.innerHTML='<ul>'+p.steps.map(s=>`<li>${s.label}${s.requires_confirmation?' · confirmation required':''}</li>`).join('')+'</ul>';status.textContent='Executing safe response…';let d=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})}).then(r=>r.json());reply.textContent=d.reply||d.error;if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(reply.textContent))}catch(e){reply.textContent='Connection error: '+e}status.textContent='Ready.'}
document.querySelector('#vision').onclick=()=>send('What do you see on my screen?');let Recognition=window.SpeechRecognition||window.webkitSpeechRecognition,rec,continuous=false;if(Recognition){rec=new Recognition();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{canvas.classList.add('listening');status.textContent='Listening…'};rec.onend=()=>{canvas.classList.remove('listening');if(continuous)setTimeout(()=>rec.start(),250);else status.textContent='Ready.'};rec.onresult=e=>send(e.results[e.results.length-1][0].transcript);document.querySelector('#mic').onclick=()=>rec.start();document.querySelector('#continuous').onclick=()=>{continuous=!continuous;document.querySelector('#continuous').textContent=continuous?'◉ Continuous on':'◉ Continuous voice';if(continuous)rec.start()}}else document.querySelector('#mic').onclick=()=>status.textContent='Speech recognition is not supported in this browser.';
let stream,cam;document.querySelector('#hands').onclick=async()=>{try{if(!window.Hands)throw Error('MediaPipe did not load');stream=await navigator.mediaDevices.getUserMedia({video:true});let v=document.querySelector('#camera');v.srcObject=stream;await v.play();let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.55});let previous=null;hands.onResults(r=>{let h=r.multiHandLandmarks?.[0];canvas.classList.toggle('tracking',!!h);if(h){let x=h[0].x;if(previous!==null)group.rotation.y+=(x-previous)*4;previous=x;status.textContent='Hand tracked · pinch/drag to rotate'}});cam=new Camera(v,{onFrame:async()=>hands.send({image:v}),width:640,height:480});cam.start();document.querySelector('#hands').textContent='✦ Hands active'}catch(e){status.textContent='Hand tracking unavailable: '+e.message}};
</script></body></html>
