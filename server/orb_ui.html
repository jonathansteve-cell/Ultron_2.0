<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/pwa"><title>Ultron</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#03070d;color:#dceaff;font:15px system-ui;display:grid;place-items:center}.wrap{text-align:center;width:100vw;height:100vh;display:grid;place-items:center;position:relative}.content{width:min(720px,92vw);margin-top:-4vh}h1{font-size:clamp(24px,4vw,42px);letter-spacing:9px;margin:0 0 8px;text-shadow:0 0 20px #58a6ff}.status{color:#89a6c8;min-height:24px}.orb{display:block;width:min(65vw,360px);height:min(65vw,360px);margin:20px auto;filter:drop-shadow(0 0 28px #328dff)}.orb.listening{filter:drop-shadow(0 0 48px #2ee6a6);animation:pulse .8s infinite}.reply{min-height:30px;max-width:620px;margin:auto;padding:14px;color:#c9dcf5;white-space:pre-wrap;text-shadow:0 0 10px #2775bd}.hint{position:fixed;bottom:20px;left:0;right:0;color:#526d8d;font-size:12px}@keyframes pulse{50%{transform:scale(1.025)}}
</style></head><body><main class="wrap"><section class="content"><h1>ULTRON</h1><div class="status" id="status">Starting voice interface…</div><canvas class="orb" id="orb"></canvas><div class="reply" id="reply"></div></section><div class="hint">Voice command interface · microphone permission is required once by your browser</div></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#orb'),status=document.querySelector('#status'),reply=document.querySelector('#reply');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.z=4;const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const group=new THREE.Group();
const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.18,2),new THREE.MeshBasicMaterial({color:0x55b5ff,wireframe:true,transparent:true,opacity:.75}));const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(.72,2),new THREE.MeshBasicMaterial({color:0x9ee8ff,wireframe:true,transparent:true,opacity:.3}));const core=new THREE.Mesh(new THREE.SphereGeometry(.34,24,24),new THREE.MeshBasicMaterial({color:0xdaf8ff}));group.add(shell,inner,core);scene.add(group);function resize(){let r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){group.rotation.y+=.004;group.rotation.x=Math.sin(Date.now()/1800)*.08;renderer.render(scene,camera);requestAnimationFrame(animate)}animate();
let busy=false;let speaking=false;function restartListening(){if(!recognition||busy||speaking)return;try{recognition.start()}catch(e){}}async function send(message){if(busy)return;busy=true;if(recognition)try{recognition.stop()}catch(e){}status.textContent='Thinking…';try{let r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});let d=await r.json();reply.textContent=d.reply||d.error||'No response';if('speechSynthesis'in window){speaking=true;speechSynthesis.cancel();let voice=new SpeechSynthesisUtterance(reply.textContent);voice.onend=()=>{speaking=false;setTimeout(restartListening,250)};speechSynthesis.speak(voice)}}catch(e){reply.textContent='Connection error: '+e.message}finally{busy=false;status.textContent='Listening…';if(!speaking)setTimeout(restartListening,250)}}
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition,starting=false;if(Recognition){recognition=new Recognition();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;recognition.onstart=()=>{starting=false;canvas.classList.add('listening');status.textContent='Listening…'};recognition.onend=()=>{canvas.classList.remove('listening');starting=false;if(!busy&&!speaking)setTimeout(restartListening,350)};recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){status.textContent='Microphone permission is required; allow it and reload this page.'}else if(e.error!=='aborted')status.textContent='Voice connection interrupted; restarting…'};recognition.onresult=e=>{let result=e.results[e.results.length-1];if(result.isFinal){let command=result[0].transcript.trim();if(command)send(command)}};window.addEventListener('load',()=>{starting=true;try{recognition.start()}catch(e){status.textContent='Allow microphone access, then reload.'}})}else status.textContent='This browser does not support voice commands. Use Chrome or Edge.';
</script></body></html>
