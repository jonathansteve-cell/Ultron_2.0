<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/pwa"><title>Ultron Orb</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05080d;color:#dceaff;font:15px system-ui}.orb-wrap{text-align:center;width:min(700px,92vw)}.orb{margin:20px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9f1ff,#58a6ff 16%,#1d4e89 42%,#071323 70%);box-shadow:0 0 40px #2386ff,0 0 110px #1469cc55;animation:pulse 3s infinite}.orb.listening{animation:pulse .7s infinite;box-shadow:0 0 65px #2ee6a6,0 0 130px #2ee6a655}.orb.tracking{box-shadow:0 0 65px #ff52d0,0 0 130px #ff52d055}h1{letter-spacing:5px}p{color:#91a9c8}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid #31577e;background:#10233d;color:#dceaff;border-radius:22px;padding:11px 18px;cursor:pointer}button.primary{background:#58a6ff;color:#07111f;font-weight:bold}.reply{margin:22px auto;padding:18px;text-align:left;white-space:pre-wrap;background:#0d1727;border:1px solid #203852;border-radius:15px;min-height:60px}video{display:none}@keyframes pulse{50%{transform:scale(1.04)}}a{color:#58a6ff}
</style></head><body><main class="orb-wrap"><h1>ULTRON</h1><div id="orb" class="orb"></div><p id="status">Voice, camera, and hand interface ready.</p><video id="camera" playsinline></video><div class="controls"><button class="primary" id="mic">● Speak</button><button id="vision">◌ Describe screen</button><button id="hands">✦ Enable hands</button><a href="/">Chat</a></div><div id="reply" class="reply">Awaiting command.</div></main><script>
const orb=document.querySelector('#orb'),status=document.querySelector('#status'),reply=document.querySelector('#reply');
async function send(message){status.textContent='Executing…';try{let r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});let d=await r.json();reply.textContent=d.reply||d.error;if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(reply.textContent))}catch(e){reply.textContent='Connection error: '+e}status.textContent='Ready.'}
document.querySelector('#vision').onclick=()=>send('What do you see on my screen?');
let Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(Recognition){let rec=new Recognition();rec.lang='en-US';rec.onstart=()=>{orb.classList.add('listening');status.textContent='Listening…'};rec.onend=()=>{orb.classList.remove('listening');status.textContent='Ready.'};rec.onresult=e=>send(e.results[0][0].transcript);document.querySelector('#mic').onclick=()=>rec.start()}else document.querySelector('#mic').onclick=()=>{status.textContent='Speech recognition is not supported in this browser.'};
let stream,cam;document.querySelector('#hands').onclick=async()=>{try{if(!window.Hands)throw Error('MediaPipe could not load');stream=await navigator.mediaDevices.getUserMedia({video:true});let video=document.querySelector('#camera');video.srcObject=stream;await video.play();let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.55});hands.onResults(r=>{let found=(r.multiHandLandmarks||[]).length;orb.classList.toggle('tracking',found>0);status.textContent=found?`${found} hand${found>1?'s':''} tracked · Ready.`:'Camera active · show a hand.'});cam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:640,height:480});cam.start();document.querySelector('#hands').textContent='✦ Hands active'}catch(e){status.textContent='Hand tracking unavailable: '+e.message}};
</script></body></html>
