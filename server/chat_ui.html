<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultron AI</title><style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101827;--line:#22324b;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#142745,var(--bg) 40%);font:15px system-ui;color:#e6edf3;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:25px;margin:0;color:#fff}small{color:#8ba2be}.links a{color:var(--blue);margin-left:15px}.chat{height:65vh;min-height:360px;overflow:auto;padding:20px;background:#0b111d;border:1px solid var(--line);border-radius:18px}.msg{white-space:pre-wrap;line-height:1.5;max-width:80%;padding:12px 15px;border-radius:14px;margin:10px 0}.bot{background:var(--panel);border:1px solid #1d2b40}.user{background:#174a83;margin-left:auto}.form{display:flex;gap:10px;margin-top:14px}input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;color:white;font-size:15px}button{border:0;border-radius:12px;padding:0 20px;background:var(--blue);color:#07111f;font-weight:700;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main class="wrap"><header class="top"><div><h1>◉ ULTRON</h1><small>Designer assistant · ready</small></div><nav class="links"><a href="/orb">Orb</a></nav></header><section id="chat" class="chat"><div class="msg bot">Acknowledged. How can I help with your design workflow?</div></section><form class="form" id="form"><input id="input" autocomplete="off" placeholder="Try: suggest a color palette" autofocus><button>Send</button></form></main><script>
const chat=document.querySelector('#chat'),input=document.querySelector('#input'),form=document.querySelector('#form');function add(text,who){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.append(d);chat.scrollTop=chat.scrollHeight}form.onsubmit=async e=>{e.preventDefault();let text=input.value.trim();if(!text)return;add(text,'user');input.value='';form.querySelector('button').disabled=true;try{let r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text})});let d=await r.json();add(d.reply||d.error,'bot')}catch(err){add('Connection error: '+err,'bot')}finally{form.querySelector('button').disabled=false;input.focus()}};
</script></body></html>
